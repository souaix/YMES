services:
  ymes-api:
    build:
      context: ../src
      dockerfile: YMes.Api/Dockerfile
    image: ymes-api:current
    container_name: ymes-api
    restart: unless-stopped
    network_mode: host
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://127.0.0.1:18088
      YMES_ENVIRONMENT: production
      YMES_PATH_BASE: /YMES/API
      YMES_MASTER_DATA_PROVIDER: postgres
      YMES_ALLOWED_ORIGINS: https://152.42.195.128;https://yakuyama.com
      YMES_DATA_PROTECTION_PATH: /data/dpkeys
      YMES_QC112_FILE_STORAGE_PATH: /data/qc112
      YMES_QC112_MAX_STORAGE_BYTES: 1073741824
      AllowedHosts: 152.42.195.128;yakuyama.com;127.0.0.1;localhost
      ConnectionStrings__YMes: ${YMES_CONNECTION_STRING:?YMES_CONNECTION_STRING is required}
    volumes:
      - ymes-dpkeys:/data/dpkeys
      - ymes-qc112-files:/data/qc112
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:18088/YMES/API/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  ymes-web:
    build:
      context: ../web
      dockerfile: Dockerfile
    image: ymes-web:current
    container_name: ymes-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:18089:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  ymes-dpkeys:
    name: ymes-dpkeys
  ymes-qc112-files:
    name: ymes-qc112-files
